<header class="navbar navbar-expand-lg sticky-top px-3 app-header-bar">
  <a class="navbar-brand col-md-3 col-lg-2 me-0 px-0 app-header-brand" routerLink="/app/inicio">
    <i class="bi bi-kanban app-header-logo d-inline-flex text-primary"></i>
    <span class="app-header-title">P3 – Tareas y empleados</span>
  </a>
  <div class="d-flex ms-auto align-items-center">
    <ul class="navbar-nav flex-row align-items-center">
      <li class="nav-item dropdown" style="margin-right: 20px">
        <a
          class="nav-link dropdown-toggle d-flex align-items-center gap-2"
          href="#"
          id="userDropdown"
          role="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <i class="bi bi-person-circle fs-4 text-secondary"></i>
          {{ usuario() }}
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
          <li>
            <a class="dropdown-item" (click)="logout()"
              >Cerrar sesión <i class="bi bi-box-arrow-right"></i
            ></a>
          </li>
        </ul>
      </li>
      <li class="nav-item d-lg-none">
        <button
          class="nav-link px-2"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#sidebarMenu"
          aria-controls="sidebarMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="bi bi-list fs-5"></i>
        </button>
      </li>
    </ul>
  </div>
</header>
