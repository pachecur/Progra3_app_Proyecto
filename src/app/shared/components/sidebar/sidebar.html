<div
    class="offcanvas-md offcanvas-end app-sidebar"
    tabindex="-1"
    id="sidebarMenu"
    aria-label="sidebarMenuLabel"
    style="background-color: var(--clr-sidebar-bg)"
>
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="sidebarMenuLabel">Menú</h5>
        <button
            type="button"
            class="btn-close text-reset"
            data-bs-dismiss="offcanvas"
            aria-label="Cerrar"
        ></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-0 pt-lg-3 overflow-y-auto">
        <ul class="nav flex-column">
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/inicio"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                    <i class="bi bi-house-gear text-secondary"></i>
                    Inicio
                </a>
            </li>
        </ul>

        <hr class="my-3" />

        <h6
            class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-1 mb-1 text-body-secondary text-uppercase"
        >
            <span>Catálogos</span>
        </h6>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/empleados"
                    routerLinkActive="active"
                >
                    <i class="bi bi-person-badge"></i>
                    Empleados
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/estados-orden"
                    routerLinkActive="active"
                >
                    <i class="bi bi-flag"></i>
                    Estados de orden
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/tareas"
                    routerLinkActive="active"
                >
                    <i class="bi bi-list-task"></i>
                    Tareas
                </a>
            </li>
        </ul>

        <hr class="my-3" />

        <h6
            class="sidebar-heading d-flex justify-content-between align-items-center px-3 mt-1 mb-1 text-body-secondary text-uppercase"
        >
            <span>Administración</span>
        </h6>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/tipos-identificacion"
                    routerLinkActive="active"
                >
                    <i class="bi bi-ui-checks-grid"></i>
                    Tipos de Identificación
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/usuarios"
                    routerLinkActive="active"
                >
                    <i class="bi bi-people"></i>
                    Usuarios
                </a>
            </li>
            <li class="nav-item">
                <a
                    class="nav-link d-flex align-items-center gap-2"
                    routerLink="/app/reportes"
                    routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                    <i class="bi bi-bar-chart-fill"></i>
                    Reportes
                </a>
            </li>
        </ul>
    </div>
</div>
