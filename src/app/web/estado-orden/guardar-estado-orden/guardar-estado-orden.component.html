<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-buttom">
  <h3 class="h3 fw-semibold text-dark mb-0">Guardar estado de orden</h3>
  <div class="btn-toolbar mb-2 mb-md-0">
    <a
      type="button"
      class="btn btn-sm btn-outline-danger d-flex align-items-center gap-2 fw-medium"
      routerLink="/app/estados-orden"
    >
      <i class="bi bi-box-arrow-left"></i>
      <span>Regresar al listado</span>
    </a>
  </div>
</div>

<div class="card">
  <div class="card-header">
    Ingrese los valores requeridos. <span class="text-danger">*</span>
  </div>
  <div class="card-body">
    <form [formGroup]="formGuardar" (ngSubmit)="guardar()">
      <div class="mb-3">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control mb-2"
          placeholder="Nombre del estado..."
          formControlName="nombre"
        />
        @if (nombre.errors && (nombre.dirty || nombre.touched)) {
          <span class="text-danger mb-2 d-block">El nombre es requerido.</span>
        }
      </div>
      <div class="d-grid gap-2 d-md-flex justify-content-md-end">
        <button type="submit" class="btn btn-outline-dark" [disabled]="formGuardar.invalid">
          <i class="bi bi-plus-circle"></i>
          Guardar
        </button>
        <a type="button" class="btn btn-outline-danger" routerLink="/app/estados-orden">
          <i class="bi bi-x-circle"></i>
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
